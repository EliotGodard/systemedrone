# Schéma d'édition pour Pages CMS (app.pagescms.org).
# Attention : la `description` d'un champ `list` est répétée sous CHAQUE élément.
# L'essentiel va donc dans les libellés, affichés une seule fois.
content:
  - name: tarifs
    label: Grille tarifaire
    path: config.json
    type: file
    format: json
    fields:
      - name: version
        label: Version
        type: string
        description: Date du jour. Elle accompagne chaque demande de devis.

      - name: toiture
        label: Toiture
        type: object
        description: Toujours un coefficient de plus que de seuils (3 seuils = 4 tarifs).
        fields:
          - name: tranches
            label: Seuils de surface (m²) — borne haute exclue, ordre croissant
            type: number
            list: true
          - name: preventif
            label: Préventif — toiture sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
          - name: curatif
            label: Curatif — toiture très sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true

      - name: murs
        label: Murs
        type: object
        description: Seuils propres aux murs. Tout laisser vide = facturé comme la toiture.
        fields:
          - name: tranches
            label: Seuils de surface (m²) — borne haute exclue, ordre croissant
            type: number
            list: true
          - name: preventif
            label: Préventif — mur sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
          - name: curatif
            label: Curatif — mur très sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
