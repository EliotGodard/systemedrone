# Schéma d'édition pour Pages CMS (app.pagescms.org).
# Enregistrer depuis le CMS écrit `config.json` et pousse un commit :
# Vercel redéploie, les nouveaux tarifs sont en ligne en une vingtaine de secondes.
# Pas de clé `media` : le CMS n'édite ici qu'un fichier de tarifs, aucune image.
content:
  - name: tarifs
    label: Grille tarifaire
    path: config.json
    type: file
    format: json
    fields:
      - name: version
        label: Version de la grille
        type: string
        description: >-
          Date de mise à jour (AAAA-MM-JJ). Elle accompagne chaque demande de devis :
          c'est ce qui permet de savoir plus tard sur quels tarifs un devis a été établi.
          À modifier à chaque changement de prix.

      - name: toiture
        label: Toiture
        type: object
        fields:
          - name: tranches
            label: Seuils de surface (m²)
            type: number
            list: true
            description: >-
              Les paliers de dégressivité, dans l'ordre croissant. Chaque seuil est la
              borne haute EXCLUE de sa tranche : 80, 200, 300 décrit quatre tranches —
              moins de 80 m², 80 à 199 m², 200 à 299 m², 300 m² et plus. Il faut donc
              toujours UN COEFFICIENT DE PLUS que de seuils. Les intitulés affichés aux
              clients sont calculés automatiquement, il n'y a rien à écrire.
          - name: preventif
            label: Préventif — toiture sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
          - name: curatif
            label: Curatif — toiture très sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true

      - name: murs
        label: Murs
        type: object
        description: >-
          Les murs ont leurs propres seuils : une façade fait rarement la surface d'un
          toit, la dégressivité ne peut pas suivre les mêmes paliers. Laisser toute la
          section vide revient à facturer les murs exactement comme la toiture.
        fields:
          - name: tranches
            label: Seuils de surface (m²)
            type: number
            list: true
            description: Mêmes règles que pour la toiture — un coefficient de plus que de seuils.
          - name: preventif
            label: Préventif — mur sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
          - name: curatif
            label: Curatif — mur très sale (€/m²)
            type: object
            fields:
              - name: sans
                label: Sans étage
                type: number
                list: true
              - name: avec
                label: Avec étage
                type: number
                list: true
